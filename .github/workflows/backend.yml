name: Backend

# Runs the backend, contract and integration suites (auth/sessions, RBAC,
# tenant isolation, alert pipeline, AI observability, recovery orchestration,
# hybrid detection, model lifecycle, replay, the migration harness, the
# agent wire contract and the cross-service flows) against a real Postgres
# service container — the backend has no mocked-DB path, so this is the only
# meaningful CI signal for it.
#
# Results stay in the job log; nothing is uploaded as an artifact
# (docs/adr/0004-ci-artifact-policy.md).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelx_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sentinelx_dev
      JWT_SECRET_KEY: ci-test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      # Generates a throwaway Ed25519 keypair for this run only, using the
      # project's own key-generation utility — never the real signing key,
      # which is gitignored and only ever exists on developer machines /
      # production. Written to the runner's temp dir (auto-deleted with the
      # ephemeral runner at job end) and never uploaded as an artifact.
      - name: Generate temporary recovery signing key
        run: python scripts/generate_recovery_signing_key.py "${{ runner.temp }}/recovery_signing_key.pem"

      # Backend, contract and integration suites share tests/conftest.py, so
      # they run as one invocation. e2e/ needs a live staging deployment and
      # load/ is a Locust file, not a pytest suite — both are excluded here
      # rather than skipped, so a collection error in them still surfaces
      # locally instead of being silently green in CI.
      - name: Run test suites (backend, contract, integration)
        working-directory: backend
        env:
          PYTHONPATH: .
          RECOVERY_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/recovery_signing_key.pem
        run: pytest ../tests/backend ../tests/contract ../tests/integration -v
