name: Deploy Dashboard (GitHub Pages)

# GitHub Pages is free and unmetered for public repositories, so the dashboard
# costs nothing to host. Two details make the SPA work there:
#
#  1. VITE_BASE_PATH — a project site is served from /<repo>/, so every asset
#     URL and the React Router basename need that prefix.
#  2. 404.html — Pages has no SPA rewrite rule. Serving a copy of index.html as
#     the 404 document makes a hard refresh on /devices/<id> load the app
#     instead of GitHub's own 404 page.
#
# VITE_API_BASE_URL is a repository *variable*, not a secret: it is a public
# URL that ships inside the JavaScript bundle. Never put a real secret in a
# VITE_-prefixed variable — everything so prefixed is world-readable output.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Gate the deploy on the same checks the Frontend workflow runs, so a
      # broken build never reaches the published site.
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
