name: Frontend

# Lints, tests, type-checks and builds the React dashboard. No backend is
# needed: the Vitest suites stub `fetch`, and the build only needs
# VITE_API_BASE_URL to be resolvable at runtime, not at build time
# (src/lib/api.ts falls back to a default base URL).

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        # Vitest prints to the job log. No coverage bundle and no JSON/JUnit
        # reporter — CI must not persist artifacts
        # (docs/adr/0004-ci-artifact-policy.md).
        run: npm run test

      - name: Type-check and build
        # tsc -b covers the test files too (tsconfig.app.json includes src/),
        # so a broken test type fails here rather than at the next `npm test`.
        run: npm run build
