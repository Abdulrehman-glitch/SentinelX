name: Container

# Validates the API image WITHOUT publishing it. Hosting is paused (see
# docs/adr/0003-hosting-freeze.md), so routine CI has no reason to push a
# deployment image anywhere: the build, the smoke test and the CVE scan are
# the parts that carry engineering value, and all three work on a locally
# loaded image.
#
# Nothing here needs `packages: write`, a registry login, or an artifact
# upload — see docs/adr/0004-ci-artifact-policy.md. Publishing to GHCR now
# lives in container-publish.yml, which is manual-only.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "migrations/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build context is the repository root — backend/Dockerfile needs
      # migrations/ as well as backend/. `load` puts the image in the
      # runner's local daemon; it is discarded with the ephemeral runner.
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        env:
          # docker/build-push-action@v6 uploads a build record as a
          # `.dockerbuild` Actions artifact by DEFAULT. That default is what
          # produced every non-expired artifact this repository had before
          # this sprint. Turning it off is the single highest-value artifact
          # fix here — the job summary still renders, only the persisted
          # upload goes away.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: sentinelx-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually works, not merely that it built. Imports the
      # whole app (so a missing runtime dependency fails here) and asserts the
      # migration files are where the code looks for them — that path is
      # derived from __file__, so an image layout change breaks it silently.
      - name: Smoke-test the image
        run: |
          docker run --rm \
            -e DATABASE_URL='postgresql+psycopg://smoke:smoke@localhost:5432/smoke' \
            -e JWT_SECRET_KEY='smoke-test-secret-not-used-for-anything' \
            sentinelx-api:ci \
            python -c "
          import app.main
          from app.db.apply_migrations import MIGRATIONS_DIR
          assert MIGRATIONS_DIR.is_dir(), f'missing migrations dir: {MIGRATIONS_DIR}'
          found = list(MIGRATIONS_DIR.glob('*.sql'))
          assert found, f'no .sql files under {MIGRATIONS_DIR}'
          print(f'ok: app imports, {len(found)} migrations at {MIGRATIONS_DIR}')
          "

      # Fails the build on a fixable HIGH/CRITICAL OS or library CVE. Scans the
      # image that was just built; nothing is uploaded to a third party.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelx-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
